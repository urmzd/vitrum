[project]
name = "vitrum-cli"
version = "0.1.0"
description = "vitrum: the Vitrum command line (list, train, benchmark, observe, results, microbench, data)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "vitrum-architectures",
    "vitrum-core",
    "vitrum-data",
    "vitrum-training",
    "torch>=2.4",
]

[project.scripts]
vitrum = "vitrum.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vitrum.cli"

[tool.uv.sources]
vitrum-architectures = { workspace = true }
vitrum-core = { workspace = true }
vitrum-data = { workspace = true }
vitrum-training = { workspace = true }
