[project]
name = "vitrum-training"
version = "0.1.0"
description = "Vitrum training loop: DDP/torchrun entry point (torchrun -m vitrum.training)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "vitrum-core",
    "numpy",
    "sentencepiece",
    "torch>=2.4",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vitrum.training"

[tool.uv.sources]
vitrum-core = { workspace = true }
