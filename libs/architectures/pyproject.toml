[project]
name = "vitrum-architectures"
version = "0.1.0"
description = "Reference architecture zoo for Vitrum: discoverable, self-contained example models"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "vitrum-core",
    "pydantic-settings>=2.13.1",
    "torch>=2.4",
]

# Registers the bundled architectures with vitrum.core.registry.
# Third-party packages can join the same registry by exposing their own
# entry point in this group.
[project.entry-points."vitrum.architectures"]
bundled = "vitrum.architectures"

[build-system]
requires = ["uv_build>=0.8.3,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vitrum.architectures"

[tool.uv.sources]
vitrum-core = { workspace = true }
